[project]
name = "echonet-demo"
version = "0.1.0"
description = "EchoNet-Dynamic demo — echo video analysis with ResNet and U-Net"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
    "Pillow>=10.0.0",
    "tqdm>=4.65.0",
    "google-genai==2.9.0",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
